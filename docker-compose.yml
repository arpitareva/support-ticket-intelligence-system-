# Optional convenience wrapper. The application runs fine without Docker -
# see the README "Run locally" section.
services:
  support-ticket-ai:
    build: .
    ports:
      - "8000:8000"   # FastAPI  -> http://localhost:8000/docs
      - "8501:8501"   # Streamlit -> http://localhost:8501
    env_file:
      - .env
    environment:
      API_BASE_URL: http://localhost:8000
